{% extends "base.html" %}

{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white p-4 text-center border-0 position-relative">
                <div class="login-badge mb-2">
                    <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
                </div>
                <h4 class="fw-bold mb-1">訂單管理系統</h4>
                <p class="text-white-50 small mb-0">請輸入管理員憑證登入系統</p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary fw-semibold small">管理員帳號</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-light border-start-0" id="username" name="username" value="admin" required autofocus placeholder="請輸入帳號">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary fw-semibold small">管理員密碼</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="password" name="password" value="admin123" required placeholder="請輸入密碼">
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> 立即登入
                        </button>
                    </div>
                </form>

                <div class="alert alert-info border-0 rounded-3 small p-3 mb-0 mt-3 d-flex align-items-start">
                    <i class="bi bi-info-circle-fill me-2 fs-5 flex-shrink-0 text-primary"></i>
                    <div>
                        <strong>系統預設管理員帳密：</strong><br>
                        • 帳號：<code>admin</code><br>
                        • 密碼：<code>admin123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
