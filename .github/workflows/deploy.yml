name: CI/CD Pipeline to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支援在 GitHub 網頁端手動點擊觸發

jobs:
  # -------------------------------------------------------------
  # 1. 持續整合階段 (Continuous Integration, CI)：自動化測試與代碼驗證
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 資料庫初始化與編碼驗證 (Check Database)
        run: |
          python database.py
          python check_db.py

      - name: 執行端對端單元與整合測試 (Run Test Suite)
        run: |
          python test_app.py

  # -------------------------------------------------------------
  # 2. 持續部署階段 (Continuous Deployment, CD)：測試通過後觸發 Render
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: test # 嚴格要求：只有 CI 測試全數 PASS 才會進行部署！
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 觸發 Render 自動部署 (Trigger Render Deploy Hook)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "======================================================================"
            echo "⚠️ [提醒] 尚未在 GitHub Secrets 中配置 RENDER_DEPLOY_HOOK_URL！"
            echo "請前往本專案的 GitHub 倉儲 -> Settings -> Secrets and variables -> Actions"
            echo "新增 Secret 名稱：RENDER_DEPLOY_HOOK_URL"
            echo "數值：貼上在 Render 後台 (Settings -> Deploy Hook) 取得的專屬 Webhook URL"
            echo "======================================================================"
            exit 0
          fi
          echo "🚀 CI 測試已通過，正在觸發 Render 雲端自動重新建置與上線..."
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "✅ Render 已成功接收部署指令！"
